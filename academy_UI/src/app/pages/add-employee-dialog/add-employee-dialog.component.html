<h2 mat-dialog-title>Add New Employee</h2>
<mat-dialog-content>
  <form #form="ngForm" class="flex flex-col gap-3">
    <mat-form-field appearance="outline">
      <mat-label>Employee ID</mat-label>
      <input matInput [(ngModel)]="employee.employeeId" name="id" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput [(ngModel)]="employee.name" name="name" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" [(ngModel)]="employee.email" name="email" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Designation</mat-label>
      <mat-select [(ngModel)]="employee.designation" name="designation" required>
        <mat-option value="Manager">Manager</mat-option>
        <mat-option value="QA">QA</mat-option>
        <mat-option value="Developer">Developer</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Assessment (%)</mat-label>
      <input matInput type="number" [(ngModel)]="employee.assessment" name="assessment" required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Certification (%)</mat-label>
      <input matInput type="number" [(ngModel)]="employee.certification" name="certification" required />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-raised-button color="primary" [mat-dialog-close]="employee">Add</button>
</mat-dialog-actions>
