<div class="create-certification-dialog">
    <h2 mat-dialog-title class="dialog-title">Create New Certification</h2>

    <form [formGroup]="certificationForm" (ngSubmit)="onSubmit()">


        <div class="row p-3">
            <mat-dialog-content class="dialog-content">

                <mat-form-field appearance="outline" class="form-field">
                    <mat-label>Certification ID</mat-label>
                    <input matInput formControlName="certification_id" required />
                </mat-form-field>

                <mat-form-field appearance="outline" class="form-field">
                    <mat-label>Name</mat-label>
                    <input matInput formControlName="name" required />
                </mat-form-field>

                <mat-form-field appearance="outline" class="form-field">
                    <mat-label>Link</mat-label>
                    <input matInput formControlName="link" required />
                </mat-form-field>

            </mat-dialog-content>

        </div>

        <mat-dialog-actions align="end" class="dialog-actions">
            <button mat-stroked-button color="warn" mat-dialog-close>Cancel</button>
            <button mat-flat-button color="primary" type="submit">Create</button>
        </mat-dialog-actions>
    </form>
</div>
