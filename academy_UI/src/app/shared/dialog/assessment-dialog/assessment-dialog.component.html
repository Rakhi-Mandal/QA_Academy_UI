<div class="create-assessment-dialog">
  <h2 mat-dialog-title class="dialog-title">Create New Assessment</h2>

  <form [formGroup]="assessmentForm" (ngSubmit)="onSubmit()">

    <div class="row p-3">
    <mat-dialog-content class="dialog-content">

      <!-- Assessment ID -->
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Assessment ID</mat-label>
        <input matInput formControlName="assessment_id" required />
      </mat-form-field>

      <!-- Link -->
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Link</mat-label>
        <input matInput formControlName="link" required />
      </mat-form-field>

      <!-- Name -->
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" required />
      </mat-form-field>

    </mat-dialog-content>
    </div>


    <mat-dialog-actions align="end" class="dialog-actions">
      <button mat-stroked-button color="warn" mat-dialog-close>Cancel</button>
      <button mat-flat-button color="primary" type="submit">Create</button>
    </mat-dialog-actions>
  </form>
</div>
